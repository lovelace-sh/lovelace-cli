[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "lovelace"
version = "0.1.0"
description = "CLI tool for syncing files between Cloudflare R2 and local desktop"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Lovelace Development Team", email = "support@lovelace.sh"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Version Control",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "boto3>=1.26.0",
    "requests>=2.28.0",
    "websocket-client>=1.5.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "cryptography>=41.0.0",
    "packaging>=21.0",
    "inquirer>=3.1.0",
    "watchdog>=3.0.0",
]

[project.scripts]
lovelace = "lovelace.cli:main"

[project.urls]
Homepage = "https://github.com/lovelace-sh/lovelace-cli"
Documentation = "https://docs.lovelace.sh"
Repository = "https://github.com/lovelace-sh/lovelace-cli"
Issues = "https://github.com/lovelace-sh/lovelace-cli/issues"

[tool.setuptools]
packages = ["lovelace"]

[tool.setuptools.package-data]
lovelace = ["py.typed"]

[tool.setuptools.package-dir]
"" = "."